<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="imagens/favicon.ico" type="image/x-icon">
    <title>Mapa Mundi</title>
</head>
<body>
    <h1>Desafio do Mapa</h1>
    <p>Agora chegou a hora de treinar um pouco o uso de imagens, parágrafos e quebras de linhas.</p>
    <!--Todo <p> tem uma margem em cima e embaixo por padrão (por volta de 16px), então a “faixa grande branca” (<- no caso quando testei com 3 <p> pra cada linha de imagens) é a soma das margens de um parágrafo com o seguinte. A faixinha fina do exemplo do professor é só o espaçamento normal entre linhas de imagens.-->
    <p>
        <img src="imagens/mapa03.png" alt="Mapa '01'"> <img src="imagens/mapa07.png" alt="Mapa '02'"> <img src="imagens/mapa05.png" alt="Mapa '03'"><br>
        <!--A solução é usar um único <p> e separar as fileiras com <br>:-->
        <img src="imagens/mapa09.png" alt="Mapa '04'"> <img src="imagens/mapa01.png" alt="Mapa '05'"> <img src="imagens/mapa08.png" alt="Mapa '06'"><br>
        <!--O <br> quebra a linha sem criar margem nova, e o espaço entre as imagens da mesma fileira vem do espaço que você deixou no código. É o mesmo ponto do exercício das mensagens: <p> separa blocos, <br> só quebra a linha dentro deles.-->
        <img src="imagens/mapa06.png" alt="Mapa '07'"> <img src="imagens/mapa02.png" alt="Mapa '08'"> <img src="imagens/mapa04.png" alt="Mapa '09'">
    </p>
</body>
</html>
