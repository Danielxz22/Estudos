<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste com Imagens</title>
</head>
<body>
    <h1>Testando carga e Imagem</h1>
    <p>Abaixo você vai ver uma imagem que está na mesma pasta.</p>
    <img src="logo-html-200.png" alt="Logo HTML5" title="Esse é o logo do HTML5">
    <!--title serve pra fazer aparecer uma "mensagenzinha" quando vc bota o mouse em cima da imagem, é algo q eu particularmente gosto mto-->
    <p>Podemos também carregar imagens que estão em sub-pastas.</p>
    <img src="imagens/logo-css-200.png" alt="Logo CSS3" title="Esse é o logo do CSS3">
    <!--professor repetiu e repetiu por diversas vezes pra tomar cuidado com o tamanho da imagem, imagens precisam ocupar pouco espaço de armazenamento, serem pequenas tipo 9, 10, 14KB, essa minha ai do CSS ainda ficou "pesada" tendo 37KB.-->

    <p>Também podemos carregar imagens externas.</p>
    <img src="https://images.icon-icons.com/2108/PNG/512/javascript_icon_130900.png" alt="Logo JavaScript" title="Esse é o logo do JavaScript">    
</body>
</html>
